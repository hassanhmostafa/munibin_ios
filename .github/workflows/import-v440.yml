name: Import verified v440 IOS native source
"on":
  push:
    branches: [main]
    paths: [.github/workflows/import-v440.yml]
permissions:
  contents: write
concurrency:
  group: munibin-native-import-v440-${{ github.repository }}
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'hassanhmostafa/munibin_ios'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Verify frozen source and publish a normal fast-forward commit
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMPORT_REPOSITORY: 'hassanhmostafa/munibin_ios'
          IMPORT_MANIFEST_BLOB_SHA: '8e3ff64f67a3242d2f573f9694b6cb0347c95110'
          IMPORT_MANIFEST_SHA256: '1a5710b93988e906ce4691457bf275fd8c373ca4204c0f213f73d5d5879188ab'
          IMPORT_MANIFEST_BYTES: '496033'
          IMPORT_SOURCE_TREE_SHA: 'cc18d635230ddf3f3682440edf0dfedd0c4a899a'
          IMPORT_README_BLOB_SHA: '3c133bc178fd8950abfcfe5de6ac7c370c8904d7'
          IMPORT_CLEAN_FINAL_TREE_SHA: '8fcfbb6b46a0f0d721a2311c0ef18f7428f61819'
        run: |
          python3 - <<'MUNIBIN_IMPORT_PY'
          #!/usr/bin/env python3
          """Verified one-time source import. No project code is executed."""
          from __future__ import annotations
          
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import shutil
          import stat
          import subprocess
          import tarfile
          import tempfile
          import urllib.error
          import urllib.request
          
          
          WORKFLOW_PATH = '.github/workflows/import-v440.yml'
          REPOSITORIES = {'Android': 'hassanhmostafa/munibin_android', 'IOS': 'hassanhmostafa/munibin_ios'}
          MAX_ARCHIVE_BYTES = 128 * 1024 * 1024
          MAX_SOURCE_BYTES = 160 * 1024 * 1024
          MAX_PART_BYTES = 3 * 1024 * 1024
          
          
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          
          
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          
          
          def git_blob_sha(raw):
              return hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          
          
          def valid_sha(value, size=40):
              return isinstance(value, str) and re.fullmatch('[0-9a-f]{' + str(size) + '}', value) is not None
          
          
          def safe_path(value):
              require(isinstance(value, str) and value, 'Invalid source path')
              path = PurePosixPath(value)
              require(not path.is_absolute() and path.as_posix() == value, 'Non-canonical source path')
              require('\\' not in value and '\0' not in value and not any(c in value for c in '\r\n\t'), 'Unsafe source path characters')
              require(all(part not in ('', '.', '..', '.git') for part in value.split('/')), 'Unsafe source path component')
              require(value not in ('README.md', WORKFLOW_PATH), 'Source archive overlaps bootstrap files')
              return value
          
          
          def validate_manifest(manifest):
              require(manifest.get('schema') == 1 and manifest.get('platform') in REPOSITORIES, 'Unsupported source manifest')
              require(valid_sha(manifest.get('source_root_tree_sha')), 'Invalid source tree SHA')
              require(valid_sha(manifest.get('source_freeze_sha256'), 64), 'Invalid source freeze SHA')
              archive = manifest.get('archive', {})
              require(type(archive.get('size')) is int and 0 < archive['size'] <= MAX_ARCHIVE_BYTES, 'Invalid archive size')
              require(valid_sha(archive.get('sha256'), 64), 'Invalid archive hash')
              parts = manifest.get('parts')
              require(isinstance(parts, list) and 0 < len(parts) <= 64, 'Invalid archive parts')
              for index, part in enumerate(parts):
                  require(part.get('index') == index, 'Archive parts out of order')
                  require(type(part.get('size')) is int and 0 < part['size'] <= MAX_PART_BYTES, 'Invalid part size')
                  require(valid_sha(part.get('sha256'), 64) and valid_sha(part.get('git_blob_sha')), 'Invalid part hash')
                  require(index == len(parts) - 1 or part['size'] == MAX_PART_BYTES, 'Incomplete non-final part')
              require(sum(part['size'] for part in parts) == archive['size'], 'Parts do not match archive size')
              files = manifest.get('files')
              require(isinstance(files, list) and 0 < len(files) <= 5000, 'Invalid source file count')
              records = {}
              for record in files:
                  rel = safe_path(record.get('path'))
                  require(rel not in records, 'Duplicate source path')
                  require(type(record.get('size')) is int and 0 <= record['size'] <= MAX_SOURCE_BYTES, 'Invalid source file size')
                  require(record.get('mode') in ('100644', '100755'), 'Unsupported source file mode')
                  require(valid_sha(record.get('sha256'), 64) and valid_sha(record.get('git_sha')), 'Invalid source file hash')
                  records[rel] = record
              require(len(records) == manifest.get('source_file_count'), 'Source file count differs')
              require(len({path.casefold() for path in records}) == len(records), 'Case-colliding source paths')
              require(sum(record['size'] for record in records.values()) == manifest.get('source_bytes') <= MAX_SOURCE_BYTES, 'Source byte count differs')
              for path in records:
                  require(not any(parent.as_posix() in records for parent in PurePosixPath(path).parents if parent.as_posix() != '.'), 'Source file and directory collide')
              return records
          
          
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise RuntimeError('Unexpected GitHub API redirect')
          
          
          def fetch_blob(repository, token, sha, expected_size):
              require(repository in REPOSITORIES.values() and valid_sha(sha), 'Unexpected blob repository or SHA')
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repository + '/git/blobs/' + sha,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'Munibin-Source-Importer/440',
                  },
              )
              # GitHub wraps base64; escaped newlines in its JSON add wire overhead.
              # Bound the response separately from the exact decoded size and hashes.
              limit = ((expected_size + 2) // 3) * 4 * 2 + 128 * 1024
              try:
                  with urllib.request.build_opener(NoRedirect).open(request, timeout=60) as response:
                      payload = response.read(limit + 1)
              except urllib.error.HTTPError as error:
                  raise RuntimeError('GitHub blob request returned HTTP ' + str(error.code)) from None
              except urllib.error.URLError:
                  raise RuntimeError('GitHub blob request could not complete') from None
              require(len(payload) <= limit, 'GitHub blob response exceeded expected size')
              try:
                  metadata = json.loads(payload)
                  require(metadata.get('encoding') == 'base64', 'Unexpected GitHub blob encoding')
                  raw = base64.b64decode(''.join(metadata['content'].split()), validate=True)
              except (KeyError, ValueError, TypeError):
                  raise RuntimeError('Invalid GitHub blob response') from None
              require(metadata.get('sha') == sha and metadata.get('size') == len(raw) == expected_size, 'GitHub blob metadata differs')
              require(git_blob_sha(raw) == sha, 'GitHub blob hash differs')
              return raw
          
          
          def reconstruct_archive(manifest, destination, fetch):
              hasher = hashlib.sha256()
              size = 0
              with destination.open('wb') as output:
                  for part in manifest['parts']:
                      raw = fetch(part['git_blob_sha'], part['size'])
                      require(len(raw) == part['size'] and digest(raw) == part['sha256'], 'Archive part hash or size differs')
                      require(git_blob_sha(raw) == part['git_blob_sha'], 'Archive part Git hash differs')
                      output.write(raw)
                      hasher.update(raw)
                      size += len(raw)
              require(size == manifest['archive']['size'] and hasher.hexdigest() == manifest['archive']['sha256'], 'Reassembled archive differs')
          
          
          def extract_checked(archive, destination, records):
              require(not destination.exists(), 'Source extraction directory already exists')
              destination.mkdir()
              with tarfile.open(archive, mode='r:gz') as tar:
                  members = tar.getmembers()
                  names = [safe_path(member.name) for member in members]
                  require(len(names) == len(set(names)) == len(records) and set(names) == set(records), 'Archive paths differ from manifest')
                  for member in members:
                      record = records[member.name]
                      mode = int(record['mode'][-3:], 8)
                      require(member.isfile() and not member.issym() and not member.islnk(), 'Non-regular archive member')
                      require(member.size == record['size'] and member.mode == mode, 'Archive file size or mode differs')
                  for member in members:
                      record = records[member.name]
                      with tar.extractfile(member) as source:
                          raw = source.read(record['size'] + 1)
                      require(len(raw) == record['size'] and digest(raw) == record['sha256'], 'Source file hash or size differs')
                      require(git_blob_sha(raw) == record['git_sha'], 'Source file Git hash differs')
                      target = destination / member.name
                      require(target.resolve().is_relative_to(destination.resolve()), 'Extraction escaped source directory')
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with target.open('xb') as output:
                          output.write(raw)
                      target.chmod(int(record['mode'][-3:], 8))
          
          
          def git_environment(token, hooks):
              environment = os.environ.copy()
              authorization = base64.b64encode(('x-access-token:' + token).encode()).decode()
              settings = [
                  ('http.https://github.com/.extraheader', 'AUTHORIZATION: basic ' + authorization),
                  ('core.autocrlf', 'false'),
                  ('core.filemode', 'true'),
                  ('core.hooksPath', str(hooks)),
                  ('credential.helper', ''),
              ]
              environment['GIT_CONFIG_COUNT'] = str(len(settings))
              for index, (key, value) in enumerate(settings):
                  environment['GIT_CONFIG_KEY_' + str(index)] = key
                  environment['GIT_CONFIG_VALUE_' + str(index)] = value
              environment['GIT_CONFIG_NOSYSTEM'] = '1'
              environment['GIT_CONFIG_GLOBAL'] = '/dev/null'
              environment['GIT_TERMINAL_PROMPT'] = '0'
              environment['GIT_AUTHOR_NAME'] = environment['GIT_COMMITTER_NAME'] = 'github-actions[bot]'
              environment['GIT_AUTHOR_EMAIL'] = environment['GIT_COMMITTER_EMAIL'] = '41898282+github-actions[bot]@users.noreply.github.com'
              environment.pop('GIT_INDEX_FILE', None)
              return environment
          
          
          def git(arguments, cwd, environment):
              completed = subprocess.run(['git', *arguments], cwd=cwd, env=environment, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              require(completed.returncode == 0, 'Git command failed: ' + arguments[0] + ' (exit ' + str(completed.returncode) + ')')
              return completed.stdout.decode('utf-8', errors='strict').strip()
          
          
          def index_entries(repo, environment):
              raw = git(['ls-files', '--stage', '-z'], repo, environment)
              result = {}
              for item in raw.split('\0'):
                  if not item:
                      continue
                  metadata, path = item.split('\t', 1)
                  mode, sha, stage = metadata.split(' ')
                  require(stage == '0' and path not in result, 'Conflicting Git index entry')
                  result[path] = {'mode': mode, 'git_sha': sha}
              return result
          
          
          def verify_source_git_tree(repo, source, records, expected_sha, environment, index_path):
              env = environment.copy()
              env['GIT_INDEX_FILE'] = str(index_path)
              prefix = ['--git-dir=' + str(repo / '.git'), '--work-tree=' + str(source)]
              git(prefix + ['read-tree', '--empty'], repo, env)
              git(prefix + ['add', '--all', '.'], source, env)
              actual = git(prefix + ['write-tree'], source, env)
              require(actual == expected_sha, 'Extracted source Git tree differs from reviewed tree')
              require(index_entries(repo, env) == {path: {'mode': record['mode'], 'git_sha': record['git_sha']} for path, record in records.items()}, 'Source Git index differs')
          
          
          def verify_clean_final_tree(repo, records, readme, expected_sha, environment, index_path):
              env = environment.copy()
              env['GIT_INDEX_FILE'] = str(index_path)
              git(['update-index', '--add', '--cacheinfo', readme['mode'], readme['git_sha'], 'README.md'], repo, env)
              require(git(['write-tree'], repo, env) == expected_sha, 'Source plus README Git tree differs from expected cleanup tree')
              expected = {path: {'mode': record['mode'], 'git_sha': record['git_sha']} for path, record in records.items()}
              expected['README.md'] = readme
              require(index_entries(repo, env) == expected, 'Clean final Git index differs')
          
          
          def remote_main(repo, environment):
              output = git(['ls-remote', '--exit-code', 'origin', 'refs/heads/main'], repo, environment)
              lines = output.splitlines()
              require(len(lines) == 1, 'Unexpected remote main reference')
              sha, ref = lines[0].split('\t', 1)
              require(ref == 'refs/heads/main' and valid_sha(sha), 'Invalid remote main reference')
              return sha
          
          
          def main():
              token = os.environ.get('GITHUB_TOKEN', '')
              repository = os.environ.get('GITHUB_REPOSITORY', '')
              expected_repository = os.environ.get('IMPORT_REPOSITORY', '')
              expected_head = os.environ.get('GITHUB_SHA', '')
              manifest_sha = os.environ.get('IMPORT_MANIFEST_BLOB_SHA', '')
              manifest_digest = os.environ.get('IMPORT_MANIFEST_SHA256', '')
              manifest_size_text = os.environ.get('IMPORT_MANIFEST_BYTES', '')
              expected_tree = os.environ.get('IMPORT_SOURCE_TREE_SHA', '')
              expected_readme = os.environ.get('IMPORT_README_BLOB_SHA', '')
              expected_final_tree = os.environ.get('IMPORT_CLEAN_FINAL_TREE_SHA', '')
              require(token and repository == expected_repository and repository in REPOSITORIES.values(), 'Unexpected repository or missing workflow token')
              require(os.environ.get('GITHUB_EVENT_NAME') == 'push' and os.environ.get('GITHUB_REF') == 'refs/heads/main', 'Import requires its main-branch push event')
              require(valid_sha(expected_head) and valid_sha(manifest_sha) and valid_sha(expected_tree) and valid_sha(expected_readme) and valid_sha(expected_final_tree) and valid_sha(manifest_digest, 64), 'Invalid import configuration hashes')
              require(manifest_size_text.isdigit() and 0 < int(manifest_size_text) <= 2 * 1024 * 1024, 'Invalid manifest size')
              raw = fetch_blob(repository, token, manifest_sha, int(manifest_size_text))
              require(digest(raw) == manifest_digest, 'Import manifest hash differs')
              manifest = json.loads(raw)
              records = validate_manifest(manifest)
              require(REPOSITORIES[manifest['platform']] == repository and manifest['source_root_tree_sha'] == expected_tree, 'Manifest project differs')
              with tempfile.TemporaryDirectory(prefix='munibin-source-import-') as directory:
                  temp = Path(directory)
                  hooks = temp / 'disabled-hooks'
                  hooks.mkdir()
                  environment = git_environment(token, hooks)
                  archive = temp / 'source.tar.gz'
                  reconstruct_archive(manifest, archive, lambda sha, size: fetch_blob(repository, token, sha, size))
                  source = temp / 'source'
                  extract_checked(archive, source, records)
                  repo = temp / 'repository'
                  git(['clone', '--single-branch', '--branch', 'main', '--no-tags', '--depth', '2', 'https://github.com/' + repository + '.git', str(repo)], temp, environment)
                  require(git(['rev-parse', 'HEAD'], repo, environment) == expected_head == remote_main(repo, environment), 'Main changed after the bootstrap workflow started')
                  initial = index_entries(repo, environment)
                  require(set(initial) == {'README.md', WORKFLOW_PATH}, 'Bootstrap repository has unexpected tracked files')
                  require(all(entry['mode'] == '100644' for entry in initial.values()), 'Bootstrap file mode differs')
                  require(initial['README.md']['git_sha'] == expected_readme, 'Bootstrap README differs from reviewed content')
                  for path, entry in initial.items():
                      require(git_blob_sha((repo / path).read_bytes()) == entry['git_sha'], 'Bootstrap file changed after checkout')
                  verify_source_git_tree(repo, source, records, expected_tree, environment, temp / 'source-only.index')
                  verify_clean_final_tree(repo, records, initial['README.md'], expected_final_tree, environment, temp / 'source-only.index')
                  for path, record in records.items():
                      target = repo / path
                      target.parent.mkdir(parents=True, exist_ok=True)
                      require(not target.exists(), 'Source overlaps an existing bootstrap file')
                      shutil.copyfile(source / path, target)
                      target.chmod(int(record['mode'][-3:], 8))
                  git(['add', '--all', '.'], repo, environment)
                  expected_entries = {path: {'mode': record['mode'], 'git_sha': record['git_sha']} for path, record in records.items()}
                  expected_entries.update(initial)
                  require(index_entries(repo, environment) == expected_entries, 'Final Git index differs from source plus unchanged bootstrap files')
                  require(remote_main(repo, environment) == expected_head, 'Main changed before the source commit')
                  git(['commit', '-m', 'Import verified v440 ' + manifest['platform'] + ' native project'], repo, environment)
                  commit = git(['rev-parse', 'HEAD'], repo, environment)
                  require(git(['rev-parse', 'HEAD^'], repo, environment) == expected_head, 'Import commit has an unexpected parent')
                  require(remote_main(repo, environment) == expected_head, 'Main changed before publication')
                  git(['push', 'origin', 'HEAD:refs/heads/main'], repo, environment)
                  require(remote_main(repo, environment) == commit, 'Remote main differs after publication')
                  print(json.dumps({'status': 'published', 'repository': repository, 'commit': commit, 'source_tree_sha': expected_tree, 'source_files': len(records), 'expected_cleanup_tree_sha': expected_final_tree, 'workflow_preserved_for_explicit_cleanup': WORKFLOW_PATH}))
          
          
          if __name__ == '__main__':
              try:
                  main()
              except Exception as error:
                  # Do not expose subprocess environment, response bodies or token values.
                  if isinstance(error, RuntimeError):
                      print('Import failed: ' + str(error), flush=True)
                  else:
                      print('Import failed: ' + type(error).__name__, flush=True)
                  raise SystemExit(1)
          MUNIBIN_IMPORT_PY

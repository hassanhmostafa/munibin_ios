name: Adhkar browser check v442
on:
  push:
    paths:
      - '.github/workflows/adhkar-browser-check-v442.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact iOS commit and current Android source
        run: |
          git init ios
          git -C ios remote add origin https://github.com/hassanhmostafa/munibin_ios.git
          git -C ios fetch --depth=1 origin "$GITHUB_SHA"
          git -C ios checkout --detach FETCH_HEAD
          git clone --depth=1 https://github.com/hassanhmostafa/munibin_android.git android
      - name: Install isolated browser test dependencies
        run: |
          npm install --prefix ios/.github --no-save --package-lock=false playwright
          ios/.github/node_modules/.bin/playwright install chromium webkit
      - name: Overlay verified candidate frontend assets
        env:
          GH_API_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs = require('node:fs'), crypto = require('node:crypto');
          (async () => {
            for (const item of [{"repo":"hassanhmostafa/munibin_ios","path":"ios/www/assets/index-cvbvIECy-native103.js.gz","sha":"adcc75b396996603278e445fc53f3e4274b6f56f"},{"repo":"hassanhmostafa/munibin_ios","path":"ios/www/assets/adhkar-card-transition-v412.js.gz","sha":"36a541243e88e2190e0c44f1f88d160610332992"},{"repo":"hassanhmostafa/munibin_ios","path":"ios/www/assets/adhkar-simple-sequence-v408.js.gz","sha":"c63d85ce461bc63efd966ec176c794b173af69ba"},{"repo":"hassanhmostafa/munibin_ios","path":"ios/www/assets/munibin-hisn-v409.js.gz","sha":"47ee815ff8510bea721898ee4d4359870a5b7a12"},{"repo":"hassanhmostafa/munibin_ios","path":"ios/www/assets/prayer-city-search-v417.js.gz","sha":"481fbce1f457890372f21773378df409b52d39c6"},{"repo":"hassanhmostafa/munibin_ios","path":"ios/www/sw.js","sha":"4d077cfe49921857ea613792dde122cfafae5997"},{"repo":"hassanhmostafa/munibin_android","path":"android/app/src/main/assets/www/assets/index-cvbvIECy-native98.js.gz","sha":"811d9aa4212c6ad29306beaab69b196b607347d0"},{"repo":"hassanhmostafa/munibin_android","path":"android/app/src/main/assets/www/assets/adhkar-card-transition-v412.js.gz","sha":"36a541243e88e2190e0c44f1f88d160610332992"},{"repo":"hassanhmostafa/munibin_android","path":"android/app/src/main/assets/www/assets/adhkar-simple-sequence-v408.js.gz","sha":"c63d85ce461bc63efd966ec176c794b173af69ba"},{"repo":"hassanhmostafa/munibin_android","path":"android/app/src/main/assets/www/assets/munibin-hisn-v408.js.gz","sha":"47ee815ff8510bea721898ee4d4359870a5b7a12"},{"repo":"hassanhmostafa/munibin_android","path":"android/app/src/main/assets/www/assets/prayer-city-search-v417.js.gz","sha":"481fbce1f457890372f21773378df409b52d39c6"},{"repo":"hassanhmostafa/munibin_android","path":"android/app/src/main/assets/www/sw.js","sha":"4d077cfe49921857ea613792dde122cfafae5997"}]) {
              const response = await fetch('https://api.github.com/repos/' + item.repo + '/git/blobs/' + item.sha, { headers: { Accept: 'application/vnd.github.raw+json', Authorization: 'Bearer ' + process.env.GH_API_TOKEN, 'User-Agent': 'Munibin-browser-regression' } });
              if (!response.ok) throw new Error('Blob HTTP ' + response.status + ' for ' + item.path);
              let bytes = Buffer.from(await response.arrayBuffer());
              if ((response.headers.get('content-type') || '').includes('application/json')) {
                const value = JSON.parse(bytes.toString('utf8'));
                if (value.encoding !== 'base64') throw new Error('Unexpected blob encoding');
                bytes = Buffer.from(value.content, 'base64');
              }
              const digest = crypto.createHash('sha1').update(Buffer.from('blob ' + bytes.length + '\0')).update(bytes).digest('hex');
              if (digest !== item.sha) throw new Error('Blob checksum mismatch: ' + item.path);
              fs.writeFileSync(item.path, bytes); console.log('Verified candidate asset ' + item.path + ' ' + digest);
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Exercise native frontend adhkar in both browser engines
        env:
          IOS_ROOT: ${{ github.workspace }}/ios/www
          ANDROID_ROOT: ${{ github.workspace }}/android/app/src/main/assets/www
          QA_OUT: ${{ github.workspace }}/adhkar-browser-results
          QA_ALLOW_FAILURE: '0'
          QA_CLOCK_GEOMETRY: '1'
          QA_PLATFORMS: ios,android
          QA_ENGINES: chromium,webkit
        run: node ios/.github/adhkar-browser-regression-v442.mjs

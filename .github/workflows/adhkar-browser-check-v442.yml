      - name: Select runner Java 17
        shell: bash
        run: |
          set -euo pipefail
          build_java="${JAVA_HOME_17_X64:-}"
          if [[ -z "$build_java" || ! -x "$build_java/bin/javac" ]]; then
            echo "Runner Java 17 is unavailable"
            exit 1
          fi
          echo "JAVA_HOME=$build_java" >> "$GITHUB_ENV"
          echo "$build_java/bin" >> "$GITHUB_PATH"
          "$build_java/bin/java" -version
      - name: Compile and exercise actual durable storage and HTTP server
        shell: bash
        run: |
          set -euo pipefail
          qa_root="$GITHUB_WORKSPACE/$ANDROID_HOST_QA_DIR"
          android_root="$GITHUB_WORKSPACE/$ANDROID_PROJECT_DIR"
          mkdir -p "$qa_root/dependencies" "$qa_root/classes"
          json_jar="$qa_root/dependencies/json-20240303.jar"
          curl --fail --location --retry 3 --output "$json_jar" https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar
          mapfile -t qa_sources < <(find "$qa_root/test" "$qa_root/test-stubs" -name '*.java' -type f | sort)
          javac -source 8 -target 8 -encoding UTF-8 -cp "$json_jar" -d "$qa_root/classes" \
            "$android_root/app/src/main/java/com/motoonai/twa/NativeAppServer.java" \
            "$android_root/app/src/main/java/com/motoonai/twa/DurableQuranAudioStore.java" \
            "${qa_sources[@]}"
          java -cp "$qa_root/classes:$json_jar" com.motoonai.twa.DurableQuranAudioStoreTest
          java -cp "$qa_root/classes:$json_jar" com.motoonai.twa.NativeQuranAudioServerTest
      - name: Install Android API 36 compile dependencies
        shell: bash
        run: |
          set -euo pipefail
          android_sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$android_sdk" ]]; then
            echo "Runner Android SDK is unavailable"
            exit 1
          fi
          sdk_manager="$android_sdk/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdk_manager" ]]; then
            sdk_manager="$(command -v sdkmanager)"
          fi
          echo "ANDROID_HOME=$android_sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$android_sdk" >> "$GITHUB_ENV"
          "$sdk_manager" --sdk_root="$android_sdk" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\n' "$android_sdk" > "$GITHUB_WORKSPACE/$ANDROID_PROJECT_DIR/local.properties"
      - name: Compile the entire Android native application
        shell: bash
        working-directory: android-project
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain --stacktrace :app:compileDebugJavaWithJavac
